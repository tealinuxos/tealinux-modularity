[meta]
name = "AI Research Setup"
description = "Environment for AI development and data science."
version = "1.0.0"
author = "TeaLinuxOS Team"
category = "development"

[packages]
install = [ "ipython", "jupyter-notebook", "jupyterlab", "python", "python-matplotlib", "python-numpy", "python-pandas", "python-pip", "python-scipy", "python-seaborn",]
aur = [ "ollama-bin", "python-pytorch", "python-tensorflow", "r",]

[services]
enable = [ "ollama",]
