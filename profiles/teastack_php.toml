[meta]
name = "TeaStack PHP Pack"
description = "Modern native Linux PHP stack untuk Laravel, CodeIgniter, dan pengembangan PHP."
version = "1.0.0"
author = "TeaLinuxOS Team"
category = "development"

[packages]
install = [
    "apache",
    "nginx",
    "php",
    "php-fpm",
    "php-sqlite",
    "php-gd",
    "mariadb",
    "composer",
    "phpmyadmin",
    "redis",
    "curl",
    "git",
    "xdebug"
]

aur = []

[services]
enable = ["mariadb", "redis", "nginx", "php-fpm"]
